name: Build Flutter APK
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL asset zip project"
        required: true
      tag:
        description: "Tag release"
        required: true
      build_type:
        description: "release / debug"
        required: false
        default: "release"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download project
        run: |
          curl -fsSL -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}" -o project.zip
          mkdir src && unzip -q project.zip -d src
          PUB=$(find src -name pubspec.yaml -not -path "*/.*" | head -n 1)
          [ -n "$PUB" ] || { echo "pubspec.yaml tidak ditemukan di zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PUB")" >> $GITHUB_ENV

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      - name: Hapus release sementara
        if: always()
        run: gh release delete "${{ inputs.tag }}" --cleanup-tag -y --repo "${{ github.repository }}" || true
        env:
          GH_TOKEN: ${{ github.token }}
